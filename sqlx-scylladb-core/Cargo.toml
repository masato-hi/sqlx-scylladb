[package]
name = "sqlx-scylladb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core of sqlx-scylladb. Not intended to be used directly."

[features]
bytes-1 = []
migrate = ["dep:crc", "sqlx-core/migrate"]
any = ["sqlx-core/any"]
time-03 = [
  "dep:time-03",
  "sqlx-core/time",
  "scylla/time-03",
  "scylla-cql/time-03",
]
chrono-04 = [
  "dep:chrono-04",
  "sqlx-core/chrono",
  "scylla/chrono-04",
  "scylla-cql/chrono-04",
]
bigdecimal-04 = [
  "dep:bigdecimal-04",
  "sqlx-core/bigdecimal",
  "scylla/bigdecimal-04",
  "scylla-cql/bigdecimal-04",
]
secrecy-08 = ["dep:secrecy-08", "scylla/secrecy-08"]
secrecy-10 = ["dep:secrecy-10", "scylla/secrecy-10"]
openssl-010 = ["dep:openssl-010", "scylla/openssl-010"]
rustls-023 = ["dep:rustls-023", "scylla/rustls-023"]

[dependencies]
scylla = { workspace = true }
scylla-cql = { workspace = true }
sqlx-core = { workspace = true, features = [
  # Since there’s no way to enable sqlx‑core/offline only when sqlx/macros is enabled, we always turn on the offline flag.
  "offline",
] }

uuid = { workspace = true }
chrono-04 = { workspace = true, optional = true }
time-03 = { workspace = true, optional = true }
bigdecimal-04 = { workspace = true, optional = true }
secrecy-08 = { workspace = true, optional = true }
secrecy-10 = { workspace = true, optional = true }

openssl-010 = { version = "0.10", package = "openssl", optional = true }
rustls-023 = { version = "0.23", package = "rustls", optional = true }

thiserror = "2.0"
log = "0.4"
url = { workspace = true }
rustc-hash = "2.1"
bytes = "1.11"
tracing = { version = "0.1", features = ["log"] }
crc = { version = "3", optional = true }
base32 = "0.5"
sha2 = { version = "0.11", default-features = false }
dotenvy = { workspace = true }
futures-core = "0.3"
futures-util = "0.3"

[dev-dependencies]
anyhow = { workspace = true }
claims = { version = "0.8" }
